<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Thing AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; overflow-x: hidden; }
        .font-syne { font-family: 'Syne', sans-serif; }
        .cl-rootBox { width: 100% !important; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        @media (max-width: 767px) {
            .mobile-snap-container {
                display: flex;
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                scroll-behavior: smooth;
            }
            .mobile-panel {
                flex: 0 0 100%;
                scroll-snap-align: start;
                min-height: 100vh;
            }
        }
        .cl-card { 
            box-shadow: none !important; 
            border: none !important;
            background: transparent !important;
            width: 100% !important;
        }
        .cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background-color: #22d3ee;
            margin-left: 2px;
            animation: blink 1s infinite;
            vertical-align: middle;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .hat-bounce {
            animation: hat-flip-smooth 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes hat-flip-smooth {
            0% { transform: scale(1) translateY(0) rotateY(0); }
            30% { transform: scale(1.4) translateY(-15px) rotateY(0); }
            70% { transform: scale(1.4) translateY(-15px) rotateY(360deg); }
            100% { transform: scale(1) translateY(0) rotateY(360deg); }
        }

        .shimmer-active {
            position: relative;
            overflow: hidden;
        }

        /* Text Shimmer */
        .shimmer-text {
            background: linear-gradient(
                90deg, 
                #1a1a2e 0%, 
                #1a1a2e 35%, 
                #22d3ee 50%, 
                #1a1a2e 65%, 
                #1a1a2e 100%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer-sweep 3s linear infinite;
        }

        /* SVG Hat Shimmer removed */

        @keyframes shimmer-sweep {
            to { background-position: -200% center; }
        }

        /* Left Panel Animations */
        .rope-container {
            position: absolute;
            top: 0;
            left: 15%;
            transform: translateY(-100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 50;
            animation: ropeDrop 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-delay: 0.5s;
        }

        .rope {
            width: 2px;
            height: 120px;
            background: #1a1a2e;
            position: relative;
        }

        .rope-handle {
            width: 24px;
            height: 24px;
            background: #1a1a2e;
            border-radius: 50%;
            margin-top: -2px;
            cursor: pointer;
            transition: transform 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .rope-handle:active {
            transform: translateY(10px) scale(0.95);
        }

        .pull-active {
            animation: pullAction 0.4s ease-in-out forwards !important;
        }

        @keyframes ropeDrop {
            to { transform: translateY(0); }
        }

        @keyframes pullAction {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(30px); }
        }

        /* Study Scene Animation */
        .study-scene-wrapper {
            position: relative;
            width: 100%;
            height: 420px;
            margin-top: 20px;
            margin-bottom: 10px;
            transition: all 1.2s cubic-bezier(0.65, 0, 0.35, 1);
            max-width: 1100px;
            opacity: 0;
            transform: scale(0.9);
        }

        .study-scene-visible {
            opacity: 1 !important;
            transform: scale(1) !important;
        }

        .lamp-light {
            opacity: 0;
            transition: opacity 0.3s ease;
            fill: url(#lampGradient);
        }

        .scene-lit .lamp-light {
            opacity: 0.6;
        }

        .scene-lit .lamp-head {
            fill: #1e293b !important;
            filter: drop-shadow(0 0 15px rgba(34, 211, 238, 0.8));
        }

        .scene-lit .kid-silhouette {
            fill: #1e293b !important;
            opacity: 1 !important;
        }

        .scene-dark .kid-silhouette {
            fill: #475569;
            opacity: 0.3;
        }

        /* Book Animation */
        .book-open {
            opacity: 0;
            transform-origin: center;
            transform: scaleX(0);
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .scene-lit .book-open {
            opacity: 1;
            transform: scaleX(1);
        }

        .book-closed {
            transition: opacity 0.3s ease;
        }

        .scene-lit .book-closed {
            opacity: 0;
        }

        .page-flip {
            transform-origin: 25px 0; /* Center spine */
            opacity: 0;
        }

        .scene-lit .page-flip {
            animation: flipPage 1s ease-in-out forwards;
        }

        @keyframes flipPage {
            0% { transform: rotateY(0deg) scaleX(0.1); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: rotateY(0deg) scaleX(1); opacity: 1; }
        }

        /* Continuous page turning effect */
        .flipping-pages {
            opacity: 0;
        }

        .scene-lit .flipping-pages {
            opacity: 1;
            transition: opacity 0.3s;
        }

        .turning-page {
            transform-origin: 25px 5px;
            animation: turn 1.5s infinite ease-in-out;
        }

        @keyframes turn {
            0% { transform: rotateY(0deg); opacity: 0; }
            50% { transform: rotateY(-180deg); opacity: 1; }
            100% { transform: rotateY(-180deg); opacity: 0; }
        }

        /* Text reveal after bulb */
        .text-reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s ease-out;
        }

        .text-show {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        .login-card {
            background: #f7f3f0; /* Beige to match branding */
            border-radius: 48px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.06);
            border: none;
            transition: all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 360px;
            min-height: 120px;
            max-height: 120px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            opacity: 0; /* Hidden until light is on */
            transform: translateY(20px);
        }

        .login-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .login-card.expanded {
            background: #f7f3f0; /* Stays beige for consistency */
            width: 520px;
            max-height: 900px;
            min-height: 550px;
            padding-top: 50px;
        }

        .login-content {
            opacity: 0;
            visibility: hidden;
            transition: all 0.8s ease;
            width: 100%;
            height: 0;
            overflow: hidden;
        }

        .login-card.expanded .login-content {
            opacity: 1;
            visibility: visible;
            height: auto;
            margin-top: 20px;
        }

        .typing-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.8s ease;
        }

        .login-content {
            opacity: 0;
            transition: opacity 0.8s ease;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-card.expanded .login-content {
            opacity: 1;
        }

        .hat-flip {
            animation: hatRotate 1.2s cubic-bezier(0.45, 0, 0.55, 1);
        }

        @keyframes hatRotate {
            0% { transform: rotateY(0deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.3) translateY(-10px); }
            100% { transform: rotateY(360deg) scale(1); }
        }

        @media (max-width: 767px) {
            .mobile-panel.branding {
                width: 100% !important;
                background: #f7f3f0 !important;
            }

            .mobile-panel.login {
                width: 100% !important;
                background: #c8f5e1 !important;
            }

            .login-card.expanded {
                width: 92% !important;
                max-width: 340px !important;
                min-height: 480px !important;
                padding-top: 35px !important;
                border-radius: 36px !important;
                background: #f7f3f0 !important;
                border: none !important;
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
            }
            .login-card {
                width: 300px !important;
                border-radius: 32px !important;
                background: #f7f3f0 !important;
                border: none !important;
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
            }
            .login-content {
                padding-left: 1.5rem !important;
                padding-right: 1.5rem !important;
            }

            /* Table and all setup little down */
            .study-scene-wrapper {
                transform: translateY(40px) scale(0.9);
                transform-origin: top center;
                order: 0;
            }

            /* Branding text order above the animation */
            .max-w-\[450px\] {
                display: flex;
                flex-direction: column;
            }
            #brand-title {
                order: -2;
                margin-top: 10px;
                transform: translateY(-40px);
            }
            #brand-desc {
                order: -1;
                margin-bottom: 20px;
                transform: translateY(-40px);
            }
            #brand-title.text-show, #brand-desc.text-show {
                transform: translateY(20px) !important;
            }

            /* Quote little above */
            .typing-container {
                transform: translateY(-25px);
            }

            /* Smooth transition when light is on */
            .lamp-light {
                transition: opacity 1.5s ease-in-out !important;
            }
            .kid-silhouette {
                transition: fill 1.5s ease-in-out, opacity 1.5s ease-in-out !important;
            }
            .lamp-head {
                transition: all 1.5s ease-in-out !important;
            }
            .study-scene-wrapper {
                transition: all 1.5s cubic-bezier(0.65, 0, 0.35, 1) !important;
            }
            body.light-on .study-scene-wrapper {
                transform: translateY(90px) scale(1) !important;
            }
        }
    </style>
</head>
<body class="bg-white overflow-x-hidden">
    <div id="snap-container" class="min-h-screen w-full mobile-snap-container flex flex-row relative scrollbar-hide md:overflow-hidden">
        <!-- Skip Button -->
        <button onclick="skipLogin()" class="absolute top-6 right-8 z-50 text-sm font-light text-[#1e293b] hover:text-black transition-colors">
            Skip
        </button>
        
        <!-- Left Panel (Branding) -->
        <div class="mobile-panel w-full md:w-[60%] branding bg-[#f7f3f0] flex flex-col items-center justify-center p-8 md:p-12 lg:p-16 relative border-b md:border-b-0">
                <!-- Rope & Handle -->
                <div id="rope-container" class="rope-container">
                    <div class="rope"></div>
                    <div class="rope-handle" id="rope-handle">
                        <div style="width: 4px; height: 4px; background: white; border-radius: 50%;"></div>
                    </div>
                    <div id="pull-text" class="text-[10px] uppercase tracking-[0.2em] text-[#1e293b] mt-3 font-bold opacity-70 flex flex-col items-center gap-1 transition-opacity duration-300 pointer-events-none">
                        <span>Pull for login</span>
                        <svg class="w-3 h-3 animate-bounce mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
                    </div>
                </div>

                <div class="max-w-[450px] w-full flex flex-col items-center text-center relative z-1">
                    <!-- Study Scene SVG -->
                    <div id="study-scene" class="study-scene-wrapper scene-dark study-scene-visible">
                        <svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto">
                            <defs>
                                <linearGradient id="lampGradient" x1="50%" y1="0%" x2="50%" y2="100%">
                                    <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:0.9" />
                                    <stop offset="60%" style="stop-color:#22d3ee;stop-opacity:0.3" />
                                    <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:0" />
                                </linearGradient>
                            </defs>
                            <!-- Table -->
                            <rect x="40" y="220" width="320" height="8" rx="4" fill="#000000" />
                            <rect x="70" y="228" width="8" height="42" fill="#000000" />
                            <rect x="320" y="228" width="8" height="42" fill="#000000" />

                            <!-- Flower Pot (Left Side) -->
                            <g transform="translate(90, 205) scale(0.7)">
                                <path d="M5 25 L0 0 L30 0 L25 25 Z" fill="#000000" />
                                <path d="M15 0 Q15 -15, 5 -12" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" />
                                <path d="M15 0 Q15 -18, 25 -14" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" />
                                <circle cx="15" cy="-20" r="4" fill="#000000" />
                            </g>

                            <!-- Kid Silhouette (More Detailed) -->
                            <g class="kid-silhouette transition-all duration-700" transform="translate(0, 0)">
                                <path d="M140 220 C140 190, 180 175, 205 175 C230 175, 260 195, 260 215 L260 220 Z" fill="#000000" />
                                <circle cx="200" cy="150" r="22" fill="#000000" />
                                <path d="M165 205 Q185 210, 195 218" fill="none" stroke-width="6" stroke="#000000" stroke-linecap="round" opacity="0.8" />
                            </g>

                            <!-- Animated Book -->
                            <g transform="translate(175, 205)">
                                <rect class="book-closed" width="50" height="12" rx="1" fill="#000000" />
                                <path class="book-open" d="M-10 0 Q25 -5, 60 0 L60 12 Q25 7, -10 12 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
                                <line x1="25" y1="-2" x2="25" y2="12" stroke="#000000" stroke-width="1.5" stroke-opacity="0.3" />
                            </g>

                            <!-- Lamp (Articulated Style) -->
                            <path d="M300 220 L300 210 L300 100 Q300 65, 260 65" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" />
                            <circle cx="300" cy="215" r="5" fill="#000000" />
                            <path class="lamp-head transition-all duration-300" d="M240 60 L280 70 L295 105 L215 95 Z" fill="#000000" />
                            <path class="lamp-light" d="M215 95 L295 105 L370 220 L110 220 Z" fill="url(#lampGradient)" />
                        </svg>
                    </div>

                    <h1 id="brand-title" class="text-3xl md:text-4xl font-bold text-[#1a1a2e] mb-4 font-syne text-reveal">Thing AI</h1>
                    <p id="brand-desc" class="text-[#1e293b] text-base md:text-xl font-light leading-relaxed px-4 text-reveal">Unleash Your Potential with Thing AI's Intelligence Platform</p>
            </div>
        </div>

        <!-- Right Panel (Login) -->
        <div class="mobile-panel w-full md:w-[40%] login flex flex-col items-center justify-center bg-[#c8f5e1] relative overflow-hidden">
            <!-- Mobile Skip Button (Visible only on mobile for the login tab) -->
            <button onclick="skipLogin()" class="md:hidden absolute top-6 right-8 z-50 text-sm font-light text-[#1e293b] hover:text-black transition-colors">
                Skip
            </button>
            <div id="login-card" class="login-card">
                <div class="typing-container">
                    <svg id="hat-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="w-10 h-10 mb-3 text-[#1a1a2e]" stroke-width="1.2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.436 60.436 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m-15.482 0a50.57 50.57 0 00-2.658-.813A59.905 59.905 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.697 50.697 0 0112 13.489a50.702 50.702 0 017.74-3.342M6.75 15a.75.75 0 100-1.5.75.75 0 000 1.5zm0 0v-3.675A55.378 55.378 0 0112 8.443m-7.007 11.55A5.981 5.981 0 006.75 15.75v-1.5" />
                    </svg>
                    <div class="text-xl font-light text-[#1a1a2e] text-center min-h-[1.5em] flex items-center font-syne">
                        <span id="typing-quote"></span><span id="typing-cursor" class="cursor"></span>
                    </div>
                </div>
                
                <div class="login-content px-10 md:px-16 w-full">
                    <div id="clerk-sign-in" class="w-full"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Direct Subdomain Script (Bypasses many generic ad-blockers) -->
    <script>
      function skipLogin() {
        window.location.href = "/?intro=true";
      }

      (function() {
        const quotes = ["Built anything with Thing"];
        let quoteIndex = 0;
        let charIndex = 0;
        const typingQuote = document.getElementById("typing-quote");
        const typingCursor = document.getElementById("typing-cursor");
        const loginCard = document.getElementById("login-card");

        function typeQuote() {
          // Show card with a slight delay
          if (charIndex === 0) {
            loginCard.classList.add('visible');
          }

          if (charIndex < quotes[quoteIndex].length) {
            typingQuote.textContent += quotes[quoteIndex].charAt(charIndex);
            charIndex++;
            setTimeout(typeQuote, 70);
          } else {
            typingCursor.style.display = "none";
            
            setTimeout(() => {
                const hatIcon = document.getElementById('hat-icon');
                hatIcon.classList.add('hat-flip');
                
                setTimeout(() => {
                    loginCard.classList.add('expanded');
                }, 1300);
            }, 500);
          }
        }

        // Left Panel Interactive Logic
        const ropeHandle = document.getElementById('rope-handle');
        const ropeContainer = document.getElementById('rope-container');
        const scene = document.getElementById('study-scene');
        const title = document.getElementById('brand-title');
        const desc = document.getElementById('brand-desc');
        let isLightOn = false;

        function handlePull() {
          // Trigger pull animation (can pull multiple times now)
          ropeContainer.classList.remove('pull-active');
          void ropeContainer.offsetWidth; // Trigger reflow to restart animation
          ropeContainer.classList.add('pull-active');
          
          setTimeout(() => {
            if (!isLightOn) {
              // TURN ON
              isLightOn = true;
              scene.classList.remove('scene-dark');
              scene.classList.add('scene-lit');
              document.body.classList.add('light-on');
              
              const pullText = document.getElementById('pull-text');
              if (pullText) pullText.style.opacity = '0';
              
              setTimeout(() => {
                title.classList.add('text-show');
                setTimeout(() => {
                  desc.classList.add('text-show');
                }, 200);
              }, 300);

              // Retract rope slowly after turning on
              setTimeout(() => {
                ropeContainer.style.transition = 'top 1s ease-in';
                ropeContainer.style.top = '-200px';
              }, 1000);

              // Mobile vs Desktop Animation Timings
              const container = document.getElementById('snap-container');
              const isMobile = window.innerWidth < 768;

              // Reveal Branding Text
              document.getElementById('brand-title').classList.add('text-show');
              document.getElementById('brand-desc').classList.add('text-show');

              if (isMobile) {
                // Auto-slide on mobile
                setTimeout(() => {
                  container.scrollTo({
                    left: window.innerWidth,
                    behavior: 'smooth'
                  });
                }, 2500);

                // Trigger Right-side Animation AFTER scroll completes
                setTimeout(() => {
                  typeQuote();
                }, 3000);
              } else {
                // Desktop: Trigger immediately
                setTimeout(() => {
                  typeQuote();
                }, 800);
              }
            }
          }, 200);
        }

        // Remove the automatic retraction from previous code
        ropeHandle.addEventListener('click', handlePull);
        ropeHandle.addEventListener('touchstart', (e) => {
          e.preventDefault();
          handlePull();
        });

        const script = document.createElement('script');
        script.setAttribute('data-clerk-publishable-key', 'pk_test_YWxlcnQtbmFyd2hhbC04OC5jbGVyay5hY2NvdW50cy5kZXYk');
        script.async = true;
        // Using the direct accounts subdomain which is often not on blocklists
        script.src = 'https://alert-narwhal-88.clerk.accounts.dev/npm/@clerk/clerk-js@4/dist/clerk.browser.js';
        script.onload = async () => {
          await window.Clerk.load();
          
          if (window.Clerk.user) {
            // If already signed in, show a continue button instead of the sign-in form
            const signInDiv = document.getElementById('clerk-sign-in');
            signInDiv.innerHTML = `
              <div class="flex flex-col items-center gap-6 py-4 w-full">
                <div class="flex items-center gap-4 bg-white/50 p-4 rounded-2xl w-full border border-gray-100">
                  <img src="${window.Clerk.user.imageUrl}" class="w-12 h-12 rounded-full border-2 border-[#1a1a2e]">
                  <div class="text-left">
                    <p class="text-[#1a1a2e] font-bold text-sm line-clamp-1">${window.Clerk.user.fullName || window.Clerk.user.username}</p>
                    <p class="text-xs text-gray-500">Welcome back</p>
                  </div>
                </div>
                <button onclick="skipLogin()" class="bg-white text-black rounded-2xl py-4 px-8 font-light font-syne w-full transition-all hover:shadow-md active:scale-95 border border-gray-200 uppercase tracking-[0.2em] text-sm">
                  ENTER CHAT
                </button>
                <button onclick="window.Clerk.signOut().then(() => location.reload())" class="bg-white text-black rounded-2xl py-4 px-8 font-light font-syne w-full transition-all hover:shadow-md active:scale-95 border border-gray-200 uppercase tracking-[0.2em] text-xs">
                  Sign out
                </button>
              </div>
            `;
          } else {
            window.Clerk.mountSignIn(document.getElementById('clerk-sign-in'), {
              afterSignInUrl: '/?intro=true',
              afterSignUpUrl: '/?intro=true',
              appearance: {
                layout: { socialButtonsPlacement: 'bottom' },
                elements: {
                  rootBox: 'w-full',
                  card: 'shadow-none w-full bg-transparent border-0',
                  header: 'hidden',
                  formButtonPrimary: 'bg-[#1a1a2e] hover:bg-[#2a2a4e] text-white rounded-md py-3 font-semibold w-full',
                  formFieldInput: 'rounded-md border border-gray-200 py-3 px-4 focus:ring-1 focus:ring-[#22d3ee] focus:border-[#22d3ee] outline-none w-full',
                  footerActionLink: 'text-[#22d3ee] font-medium',
                  formFieldAction: 'text-[#22d3ee] font-medium'
                }
              }
            });
          }
        };
        script.onerror = () => {
          document.getElementById('clerk-sign-in').innerHTML = `
            <div class="text-center p-6 bg-red-50 rounded-lg border border-red-100">
              <p class="text-red-600 font-medium mb-2">Auth Script Blocked</p>
              <p class="text-red-500 text-sm">Your browser or network is blocking Clerk. Please disable ad-blockers or try a different browser.</p>
              <button onclick="location.reload()" class="mt-4 px-4 py-2 bg-red-600 text-white text-xs rounded hover:bg-red-700">Retry</button>
            </div>`;
        };
        document.body.appendChild(script);
      })();
    </script>
</body>
</html>
